<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Chart.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <noscript>
    <p class="noscript-warning">
      JavaScript is required to run the Expense Tracker. Please enable JavaScript in your browser settings.
    </p>
  </noscript>
</head>
<body>

  <!-- Notification bar — shown on Storage errors / warnings -->
  <div id="notification-bar" role="alert" aria-live="assertive" aria-atomic="true" hidden></div>

  <!-- ── Header ────────────────────────────────────────────────── -->
  <header>
    <h1>Expense & Budget Visualizer</h1>
  </header>

  <!-- ── Balance ───────────────────────────────────────────────── -->
  <section id="balance" aria-label="Total balance">
    <h2>Total Balance</h2>
    <p id="balance-value" aria-label="Current balance: $0.00">$0.00</p>
  </section>

  <!-- ── Input Form ─────────────────────────────────────────────── -->
  <section id="form" aria-label="Add new transaction">
    <h2>Add Transaction</h2>

    <form id="transaction-form" novalidate>

      <!-- Item Name -->
      <div class="form-group">
        <label for="item-name">Item Name</label>
        <input
          type="text"
          id="item-name"
          name="item-name"
          maxlength="100"
          placeholder="e.g. Coffee"
          aria-describedby="error-name"
          autocomplete="off"
        />
        <span id="error-name" class="error-msg" role="alert" aria-live="polite"></span>
      </div>

      <!-- Amount -->
      <div class="form-group">
        <label for="amount">Amount ($)</label>
        <input
          type="number"
          id="amount"
          name="amount"
          min="0.01"
          max="999999.99"
          step="0.01"
          placeholder="0.00"
          aria-describedby="error-amount"
        />
        <span id="error-amount" class="error-msg" role="alert" aria-live="polite"></span>
      </div>

      <!-- Category -->
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" name="category" aria-describedby="error-category">
          <option value="" disabled selected>Select a category</option>
          <!-- Populated dynamically by Renderer.renderCategoryDropdown() -->
        </select>
        <span id="error-category" class="error-msg" role="alert" aria-live="polite"></span>
      </div>

      <button type="submit">Add Transaction</button>

    </form>

    <!-- Custom Category -->
    <div class="form-group custom-category-group">
      <label for="custom-category">Add Custom Category</label>
      <div class="custom-category-row">
        <input
          type="text"
          id="custom-category"
          name="custom-category"
          maxlength="50"
          placeholder="New category name"
          aria-describedby="error-custom-category"
          autocomplete="off"
        />
        <button type="button" id="add-category-btn">Add</button>
      </div>
      <span id="error-custom-category" class="error-msg" role="alert" aria-live="polite"></span>
    </div>

  </section>

  <!-- ── Pie Chart ──────────────────────────────────────────────── -->
  <section id="chart" aria-label="Spending breakdown by category">
    <h2>Spending Breakdown</h2>

    <div id="chart-container">
      <canvas id="spending-chart" aria-label="Pie chart showing spending by category" role="img"></canvas>
      <!-- Empty-state overlay — shown when no transactions exist -->
      <div id="chart-empty-state" class="empty-state" aria-live="polite">
        No spending data available yet.
      </div>
    </div>

    <!-- Custom legend rendered by Renderer -->
    <div id="chart-legend" aria-label="Chart legend"></div>
  </section>

  <!-- ── Transaction List ───────────────────────────────────────── -->
  <section id="list" aria-label="Transaction history">
    <h2>Transactions</h2>

    <!-- Sort control -->
    <div class="sort-control-group">
      <label for="sort-control">Sort by</label>
      <select id="sort-control" name="sort-control">
        <option value="default">Default (newest first)</option>
        <option value="amount-asc">Amount: Low to High</option>
        <option value="amount-desc">Amount: High to Low</option>
        <option value="category-asc">Category: A–Z</option>
      </select>
    </div>

    <!-- Transaction entries -->
    <ul id="transaction-list" aria-label="List of transactions" aria-live="polite">
      <!-- Populated dynamically by Renderer.renderTransactionList() -->
    </ul>

  </section>

  <!-- ── Spending Limits ────────────────────────────────────────── -->
  <section id="limits" aria-label="Spending limits per category">
    <h2>Spending Limits</h2>
    <!-- Populated dynamically by Renderer.renderLimitControls() -->
    <!-- Each category gets: <label>, <input id="limit-{category}">, Set button, Clear button -->
  </section>

  <script src="js/app.js" defer></script>
</body>
</html>
